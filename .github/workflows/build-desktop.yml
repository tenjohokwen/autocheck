name: Build Desktop Apps

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add Electron mode
        run: npx quasar mode add electron || true

      - name: Build Electron app for macOS
        run: npm run build:electron:mac
        env:
          NODE_ENV: production

      - name: List build artifacts
        run: ls -la dist/electron/Packaged/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autocheck-macos
          path: |
            dist/electron/Packaged/*.dmg
            dist/electron/Packaged/*.zip
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add Electron mode
        run: npx quasar mode add electron
        continue-on-error: true

      - name: Build Electron app for Windows
        run: npm run build:electron:win
        env:
          NODE_ENV: production

      - name: List build artifacts
        run: dir dist\electron\Packaged\

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autocheck-windows
          path: |
            dist/electron/Packaged/*.exe
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add Electron mode
        run: npx quasar mode add electron || true

      - name: Build Electron app for Linux
        run: npm run build:electron:linux
        env:
          NODE_ENV: production

      - name: List build artifacts
        run: ls -la dist/electron/Packaged/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autocheck-linux
          path: |
            dist/electron/Packaged/*.AppImage
            dist/electron/Packaged/*.deb
            dist/electron/Packaged/*.rpm
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/autocheck-macos/*
            artifacts/autocheck-windows/*
            artifacts/autocheck-linux/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
